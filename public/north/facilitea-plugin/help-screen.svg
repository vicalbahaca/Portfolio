  <text x="800" y="250" fill="#004B5B" font-size="82" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800">Textos B2</text>
  <text x="106" y="375" fill="#004B5B" font-size="38" font-family="Arial, sans-serif" font-weight="800">1. Para qu&#233; sirve</text>
  <text x="106" y="455" fill="#323232" font-size="26" font-family="Arial, sans-serif">Textos B2 convierte una selecci&#243;n de Figma en una tabla de textos lista para revisar.</text>
  <text x="106" y="494" fill="#323232" font-size="26" font-family="Arial, sans-serif">Detecta capas visibles, prepara una propuesta B2 y deja el resultado listo para exportar.</text>
  <line x1="106" y1="570" x2="1462" y2="570" stroke="#D9DDE2" stroke-width="2"/>
  <text x="106" y="670" fill="#004B5B" font-size="38" font-family="Arial, sans-serif" font-weight="800">2. C&#243;mo se utiliza</text>
  <text x="106" y="745" fill="#323232" font-size="26" font-family="Arial, sans-serif">Selecciona frames, secciones, grupos, componentes, instancias o capas de texto.</text>
  <text x="106" y="784" fill="#323232" font-size="26" font-family="Arial, sans-serif">El plugin evita duplicados, mantiene la trazabilidad y deja avisos cuando hay que revisar algo.</text>
  <text x="106" y="895" fill="#004B5B" font-size="34" font-family="Arial, sans-serif" font-weight="800">Elementos que puedes seleccionar</text>
